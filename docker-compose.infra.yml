# 停车系统 - 本地基础设施（单实例演示版）
# 一键拉起：Nacos(单机) + MySQL(单库) + Redis(单点)
# 对应简历描述的微服务演示环境，不含任何高可用 / 集群组件。
#
# 注意：本机若已运行原生 MySQL(3306)/Redis(6379)/Nacos(8848)，端口会冲突，
# 启动前请先停止它们，或把下方 published 端口改成不冲突的值。
#
# 用法：
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down
#
# 应用侧接入（环境变量或 start-services.bat）：
#   NACOS_SERVER_ADDR=localhost:8848
#   DB_HOST=localhost  DB_PORT=3306
#   REDIS_HOST=localhost  REDIS_PORT=6379

networks:
  parking-net:
    driver: bridge

services:
  # ===================== Nacos 单机（内置 Derby 存储，无需外接 MySQL） =====================
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    networks: [parking-net]
    restart: unless-stopped

  # ===================== MySQL 单库（应用库，首次启动自动载入 sql/ 下脚本） =====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-changeme}"
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [parking-net]
    restart: unless-stopped

  # ===================== Redis 单点 =====================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks: [parking-net]
    restart: unless-stopped

volumes:
  mysql-data:
