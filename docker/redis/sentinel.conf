port 26379
dir /tmp
# 注意：主节点地址用占位符 __MASTER_IP__，由启动脚本解析 redis-master 容器 IP 后注入。
# 不要直接写主机名（Redis 7.4 在容器停止后无法解析会进入 TILT 且不故障转移）。
sentinel monitor mymaster __MASTER_IP__ 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 10000
