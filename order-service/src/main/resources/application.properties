spring.application.name=order-service
server.port=8085

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/order_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:changeme}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

mybatis-plus.configuration.map-underscore-to-camel-case=true
# 生产环境关闭 SQL 打印：避免拖慢性能、日志膨胀及数据落盘。本地调试可取消下行注释
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Disabled Nacos config import
spring.cloud.nacos.config.enabled=false
springdoc.api-docs.path=/api/order/v3/api-docs

# ============ Redis 配置 ============
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 哨兵（高可用）：默认使用上面的单点 host/port，不要取消注释后留空！
# Redisson 只要读到 sentinel.master 就会进入哨兵模式，空值会直接导致启动失败：
#   IllegalArgumentException: At least one sentinel node should be defined!
# 需要哨兵时，先设置环境变量 REDIS_SENTINEL_MASTER / REDIS_SENTINEL_NODES，再取消下面两行注释。
# spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER}
# spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ============ Resilience4j 熔断配置 ============
# Feign 熔断器开关
spring.cloud.openfeign.circuitbreaker.enabled=true

# 默认熔断器配置
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# parking-service 熔断器实例配置
resilience4j.circuitbreaker.instances.parkingService.base-config=default
# payment-service 熔断器实例配置
resilience4j.circuitbreaker.instances.paymentService.base-config=default
# user-service 熔断器实例配置
resilience4j.circuitbreaker.instances.userService.base-config=default

# 重试配置
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.instances.parkingService.base-config=default

# ============ 高可用：健康检查 + 优雅停机 ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
