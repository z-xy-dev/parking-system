worker_processes  1;

events {
    worker_connections 1024;
}

http {
    # 网关高可用：两个网关实例做上游，Nginx 在 80 端口提供统一 VIP。
    # 任一一台网关宕机，Nginx 通过 health_check 自动剔除并只转发到存活节点。
    upstream parking_gateway {
        zone parking_gw 64k;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=20s;
        server 127.0.0.1:8086 max_fails=3 fail_timeout=20s;
        health_check uri=/actuator/health interval=10s fails=3 passes=2;
    }

    server {
        listen 80;
        server_name localhost;

        # 前端 / 调用方统一访问 http://localhost 即可，不再直连具体网关端口
        location / {
            proxy_pass http://parking_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
