# ============================================================================
#  parking-system - 本地运行配置模板
#
#  用法：
#    1. cp config/application.example.properties config/application.properties
#    2. 按本机环境修改其中的用户名/密码
#
#  说明：
#    - 在「项目根目录」执行 java -jar xxx.jar 时，Spring Boot 会自动加载
#      工作目录下的 config/application.properties（优先级高于 jar 内配置）。
#      所以有了这个文件，启动命令里就不需要再传任何密码参数。
#    - config/application.properties 已被 .gitignore 忽略，只有本模板入库，
#      你的真实密码不会进 Git。
#    - 也可以完全不建这个文件，改用环境变量（见 .env.example）。
# ============================================================================

# ===== MySQL（各服务的库名由各自的 src/main/resources/application.properties 指定）=====
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# ===== Nacos 服务注册中心 =====
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:changeme}

# 多网卡环境下 Nacos 客户端可能挑错 IP（例如挑到虚拟网卡地址），
# 导致网关路由报 upstream connect failed。固定注册 IP 可避免。
spring.cloud.nacos.discovery.ip=127.0.0.1

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
