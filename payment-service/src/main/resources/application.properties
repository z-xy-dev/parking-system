spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:changeme}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

mybatis-plus.configuration.map-underscore-to-camel-case=true
# 生产环境关闭 SQL 打印：避免拖慢性能、日志膨胀及数据落盘。本地调试可取消下行注释
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Disabled Nacos config import
spring.cloud.nacos.config.enabled=false
springdoc.api-docs.path=/api/payment/v3/api-docs

# ============ 高可用：健康检查 + 优雅停机 ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
