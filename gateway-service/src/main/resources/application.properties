spring.application.name=gateway-service
server.port=8080

spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:changeme}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.routes[1].id=parking-service
spring.cloud.gateway.routes[1].uri=lb://parking-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/parking/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/order/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payment/**
# Disabled Nacos config import
spring.cloud.nacos.config.enabled=false

# Knife4j Gateway aggregation
knife4j.gateway.enabled=true
knife4j.gateway.routes[0].name=用户服务
knife4j.gateway.routes[0].url=/api/user/v3/api-docs
knife4j.gateway.routes[0].service-name=user-service
knife4j.gateway.routes[0].order=1
knife4j.gateway.routes[1].name=车位服务
knife4j.gateway.routes[1].url=/api/parking/v3/api-docs
knife4j.gateway.routes[1].service-name=parking-service
knife4j.gateway.routes[1].order=2
knife4j.gateway.routes[2].name=订单服务
knife4j.gateway.routes[2].url=/api/order/v3/api-docs
knife4j.gateway.routes[2].service-name=order-service
knife4j.gateway.routes[2].order=3
knife4j.gateway.routes[3].name=支付服务
knife4j.gateway.routes[3].url=/api/payment/v3/api-docs
knife4j.gateway.routes[3].service-name=payment-service
knife4j.gateway.routes[3].order=4

# ============ 高可用：健康检查 + 优雅停机 ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# 网关侧对后端实例做健康检查，自动剔除不健康实例（故障转移）
spring.cloud.loadbalancer.health-check.enabled=true
spring.cloud.loadbalancer.health-check.interval=10000
spring.cloud.loadbalancer.health-check.path.user-service=/actuator/health/readiness
spring.cloud.loadbalancer.health-check.path.parking-service=/actuator/health/readiness
spring.cloud.loadbalancer.health-check.path.order-service=/actuator/health/readiness
spring.cloud.loadbalancer.health-check.path.payment-service=/actuator/health/readiness
